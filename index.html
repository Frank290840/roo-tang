<body>
<title>รู้ตังค์</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: phone calendar app — large titles, hairline grid, inset grouped lists, floating pill nav */
:root{
  --bg:#FFFFFF; --bg2:#F2F2F6; --card:#FFFFFF; --ink:#0C0C0E; --ink2:#3A3A3F; --muted:#8B8B91; --faint:#C4C4C9; --line:#E7E7EB;
  --red:#E5484D; --red-ink:#FFFFFF; --n:#4B5BD6; --d:#C47F0A;
  --otd:#F4C886; --otd-t:#704708; --otn:#D6C3F1; --otn-t:#4F2C86; --note:#A3D9BE;
  --ok:#2F9A5F; --ok-bg:#E3F4EA; --warn:#C7811A; --warn-bg:#FCEFD8; --bad:#D93D42; --bad-bg:#FCE4E4;
  --hero:#0C0C0E; --hero-ink:#FFFFFF; --nav:rgba(255,255,255,.9); --shadow:0 4px 24px rgba(0,0,0,.10);
  --f:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --bg2:#1C1C1E; --card:#1C1C1E; --ink:#F2F2F4; --ink2:#C9C9CE; --muted:#8E8E94; --faint:#48484C; --line:#2C2C2F;
  --red:#FF5A5F; --n:#8C99FF; --d:#F2BC62; --otd:#5A4318; --otd-t:#F6CF8E; --otn:#3F2E5E; --otn-t:#DCC9FA; --note:#2F6A4E;
  --ok:#4FCB86; --ok-bg:#16301F; --warn:#F0B24D; --warn-bg:#3A2C12; --bad:#FF6B6F; --bad-bg:#3D1A1B;
  --hero:#F2F2F4; --hero-ink:#0C0C0E; --nav:rgba(36,36,38,.92); --shadow:0 4px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --bg2:#1C1C1E; --card:#1C1C1E; --ink:#F2F2F4; --ink2:#C9C9CE; --muted:#8E8E94; --faint:#48484C; --line:#2C2C2F;
  --red:#FF5A5F; --n:#8C99FF; --d:#F2BC62; --otd:#5A4318; --otd-t:#F6CF8E; --otn:#3F2E5E; --otn-t:#DCC9FA; --note:#2F6A4E;
  --ok:#4FCB86; --ok-bg:#16301F; --warn:#F0B24D; --warn-bg:#3A2C12; --bad:#FF6B6F; --bad-bg:#3D1A1B;
  --hero:#F2F2F4; --hero-ink:#0C0C0E; --nav:rgba(36,36,38,.92); --shadow:0 4px 24px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.grey{background:var(--bg2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--n);outline-offset:2px;border-radius:6px}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance}

.app{max-width:560px;margin:0 auto;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 4px;min-height:56px}
.pill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:15px;font-weight:500;white-space:nowrap}
.icons{display:inline-flex;gap:2px;padding:0 4px;height:40px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);align-items:center}
.ic{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
svg.i{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.big{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.15;padding-top:4px}
.sub{color:var(--muted);font-size:14px;padding-block:2px 12px}
.sub button{color:var(--n);font-weight:500}
.titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.arrows{display:flex;gap:6px;padding-bottom:8px}
.arrows button{width:36px;height:36px;border-radius:50%;background:var(--bg2);display:inline-flex;align-items:center;justify-content:center}

/* calendar */
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);padding-inline:max(6px,env(safe-area-inset-left,0px)) max(6px,env(safe-area-inset-right,0px))}
.dow span{font-size:12px;color:var(--muted);text-align:center;padding:6px 0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);position:relative;padding-bottom:16px;padding-inline:max(6px,env(safe-area-inset-left,0px)) max(6px,env(safe-area-inset-right,0px))}
.day{min-height:74px;display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:4px;min-width:0;border-radius:12px}
.day .d{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:18px;font-weight:500}
.day.out .d{color:var(--faint)}
.day.hol .d{color:var(--red)}
.day.sel .d{background:var(--ink);color:var(--bg)}
.day.today .d{background:var(--red);color:var(--red-ink);font-weight:600}
.tag{font-size:11px;font-weight:600;color:var(--muted);line-height:1.2;letter-spacing:.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.n{color:var(--n)}
.tag.dd{color:var(--d)}
.tag.h{color:var(--red-ink);background:var(--red);border-radius:4px;padding:1px 5px}
.bar{width:88%;max-width:56px;height:16px;border-radius:5px;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;line-height:1;white-space:nowrap;overflow:hidden}
.bar.otd{background:var(--otd);color:var(--otd-t)}
.bar.otn{background:var(--otn);color:var(--otn-t)}
.nbar{width:70%;max-width:44px;height:4px;border-radius:4px;background:var(--note)}
.day.out .bar,.day.out .tag,.day.out .nbar{opacity:.45}
.edited .d{text-decoration:underline dotted;text-underline-offset:4px}
.wsum{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:2px;font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);align-items:center;padding-block:12px 0}
.legend i{display:inline-block;width:16px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* detail */
.detail{display:flex;flex-direction:column;gap:10px;padding-top:16px}
.dhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.dhead b{font-size:20px}
.ev{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--bg2);text-align:left;width:100%}
.ev .sw{width:4px;align-self:stretch;border-radius:4px;flex:none}
.ev .t{flex:1;min-width:0}
.ev .t b{display:block;font-size:15px;font-weight:600}
.ev .t span{font-size:13px;color:var(--muted)}
.ev .r{font-size:13px;color:var(--ink2);text-align:right;white-space:nowrap}
.addnote{display:inline-flex;align-items:center;gap:8px;color:var(--n);font-size:15px;padding:6px 2px;font-weight:500}
.picker{display:flex;flex-wrap:wrap;gap:8px}
.picker button{border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;background:var(--card)}
.picker button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ownerbox{border:1px dashed var(--faint);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ownerbox .row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}

/* home */
.hero{padding:20px;border-radius:22px;background:var(--hero);color:var(--hero-ink);display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.hero .lbl{font-size:13px;opacity:.6}
.hero .amt{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-family:var(--fm)}
.hero .amt small{font-size:15px;opacity:.6;margin-left:6px;font-weight:400;font-family:var(--f)}
.hero .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;opacity:.72;margin-top:6px}
.cd{display:inline-flex;align-self:flex-start;background:color-mix(in srgb,var(--hero-ink) 14%,transparent);border-radius:999px;padding:4px 12px;font-size:13px;margin-bottom:8px}
.week7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.week7 > div{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0;border-radius:14px;min-width:0}
.week7 > div.on{background:var(--bg2)}
.week7 small{font-size:12px;color:var(--muted)}
.week7 b{font-size:18px;font-weight:600}
.week7 .hol b{color:var(--red)}

/* grouped lists */
.sec{padding-top:20px}
.sec > h3{font-size:13px;font-weight:500;color:var(--muted);margin:0 4px 7px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.group{background:var(--card);border-radius:14px;overflow:hidden}
body:not(.grey) .group{background:var(--bg2)}
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:48px;position:relative;width:100%;text-align:left}
.li+.li::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.li .k{flex:1;min-width:0;font-size:15px}
.li .k small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.li .v{font-size:15px;color:var(--ink2);text-align:right;white-space:nowrap}
.li .v.m{color:var(--bad)}
.li.tot .k,.li.tot .v{font-weight:700;color:var(--ink)}
.li.dim .k,.li.dim .v{opacity:.45}
.li input,.li select{border:0;background:transparent;text-align:right;font-size:15px;color:var(--ink2);min-width:0;width:9.5em;padding:4px 0;font-family:var(--fm)}
.li select{font-family:var(--f);width:auto;max-width:60%}
.li input:focus{outline:none;color:var(--ink)}
.li input:disabled{color:var(--muted);-webkit-text-fill-color:var(--muted);opacity:1}
.chev{color:var(--faint)}
.chipx{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-n{background:var(--bg2);color:var(--ink2)}
.tog{width:48px;height:29px;border-radius:99px;background:var(--faint);position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.tog[aria-checked="true"]{background:var(--ok)}.tog[aria-checked="true"]::after{left:21px}
.seg{display:flex;background:var(--bg2);border-radius:10px;padding:2px;gap:2px}
body.grey .seg{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.seg button{flex:1;text-align:center;padding:7px 4px;font-size:13px;color:var(--ink2);border-radius:8px;min-width:0}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600;color:var(--ink)}
.net{margin-top:14px;padding:18px 20px;border-radius:18px;background:var(--hero);color:var(--hero-ink);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.net b{font-size:28px;font-weight:600;font-family:var(--fm)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 4px 0;line-height:1.5}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-bg);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:13px;margin-top:10px}
.banner .grow{flex:1;min-width:0}
.btn{border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;background:var(--bg2);color:var(--ink)}
.btn.p{background:var(--ink);color:var(--bg)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}

/* nav */
.fnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.fnav-in{width:100%;max-width:528px;display:flex;justify-content:space-between;align-items:center;pointer-events:auto}
.fnav .tabs{display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--nav);box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.fnav .tabs button{width:54px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.fnav .tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.fnav .pill{background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* sheet */
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none!important}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:38px;height:5px;border-radius:9px;background:var(--faint);align-self:center}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:16px}
.sheet .hd .x{color:var(--muted)} .sheet .hd .ok{font-weight:600;color:var(--n)}
.input{border:0;background:var(--bg2);border-radius:12px;padding:13px 14px;font-size:16px;width:100%}
textarea.input{min-height:90px;resize:vertical}
textarea.mono{font-family:var(--fm);font-size:12px;min-height:140px}
.colors{display:flex;gap:12px}
.colors button{width:30px;height:30px;border-radius:50%}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.lbl2{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;max-width:calc(100% - 32px);text-align:center}
.toast[hidden]{display:none!important}

:root{--navy:#14275C;--navy2:#0E1C45;--coral:#F2553A;--gold:#FFC94D}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:8px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);padding:2px 0;position:relative}
.tabbar button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--navy);font-weight:600}
:root[data-theme="dark"] .tabbar button[aria-current="page"]{color:#9DB2FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabbar button[aria-current="page"]{color:#9DB2FF}}
.tabbar .mid span{width:58px;height:58px;margin-top:-30px;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(242,85,58,.35);border:4px solid var(--card)}
.tabbar .badge-dot{position:absolute;top:0;right:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.app{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
/* hero */
.h-hero{background:radial-gradient(120% 90% at 85% 0%,#2C4FB0 0%,#14275C 55%,#0E1C45 100%);color:#fff;position:relative;overflow:hidden;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 62px max(20px,env(safe-area-inset-left,0px));min-height:280px}
.h-hero .lines{position:absolute;inset:0;width:100%;height:100%;opacity:.3}
.h-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.h-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.h-brand svg{width:30px;height:30px;border-radius:8px}
.av{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background-size:cover;background-position:center;flex:none;border:2px solid rgba(255,255,255,.35)}
.h-text{position:relative;z-index:1;margin-top:18px;max-width:62%}
.h-text small{font-size:13px;opacity:.75}
.h-text h1{margin:4px 0 0;font-size:27px;line-height:1.25;font-weight:700}
.h-chip{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:7px 12px;font-size:13px;flex-wrap:wrap}
.h-chip b{color:#FFD27A}
.h-ill{position:absolute;right:-10px;top:calc(56px + env(safe-area-inset-top,0px));width:150px;z-index:0}
.paybar{position:relative;z-index:2;margin:-36px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px}
.paybar .pb{flex:1;min-width:0;min-height:66px;border-radius:18px;background:var(--card);border:2px solid var(--navy);display:flex;align-items:center;gap:12px;padding:8px 14px;box-shadow:0 6px 18px rgba(20,39,92,.14);text-align:left}
.paybar .ib{width:40px;height:40px;border-radius:12px;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--navy);flex:none}
.paybar b{display:block;font-size:15.5px;color:var(--ink)}
.paybar small{display:block;font-size:12.5px;color:var(--muted)}
.paybar .bell{width:66px;flex:none;border-radius:18px;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--navy);position:relative;box-shadow:0 6px 18px rgba(20,39,92,.08)}

/* ================= dates ================= */
const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
const DOWF=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const MONF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function D(s){const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));}
function S(dt){return dt.toISOString().slice(0,10);}
function add(s,n){const d=D(s);d.setUTCDate(d.getUTCDate()+n);return S(d);}
function ymd(y,m,d){return S(new Date(Date.UTC(y,m,d)));}
function dow(s){return D(s).getUTCDay();}
function diff(a,b){return Math.round((D(b)-D(a))/864e5);}
function Y(s){return +s.slice(0,4);} function M(s){return +s.slice(5,7)-1;} function DD(s){return +s.slice(8,10);}
function todayStr(){const n=new Date();return ymd(n.getFullYear(),n.getMonth(),n.getDate());}
function fd(s,o={}){let t=`${DD(s)} ${MON[M(s)]}`;if(o.dow!==false)t=`${DOW[dow(s)]}. `+t;if(o.year)t+=` ${(Y(s)+543)%100}`;return t;}
function weekStart(s){return add(s,-((dow(s)+1)%7));}
function endOfMonth(s){return add(ymd(Y(s),M(s)+1,1),-1);}

/* ================= Thai lunar holidays (validated 2561–2571) ================= */
function lunarParams(cs){const h=Math.floor((cs*292207+499)/800)+1;const kc=800-((cs*292207+499)%800);const av=(11*h+650)%692;const ti=(Math.floor((11*h+650)/692)+h)%30;return{h,kc,av,ti};}
function athikamat(cs){const t=lunarParams(cs).ti,tn=lunarParams(cs+1).ti;if(t>=25||t<=5){if(t===25&&(tn>=25||tn<=5))return false;return true;}return t===24&&tn===6;}
function athikawan(cs){if(athikamat(cs))return false;const p=lunarParams(cs);return p.kc<=207?p.av<=126:p.av<=137;}
function lunarYearLen(be){const cs=be-1181;return athikamat(cs)?384:athikawan(cs)?355:354;}
const LUNAR_ANCHOR_BE=2569,LUNAR_ANCHOR='2025-11-21';
function lunarStart(be){let d=LUNAR_ANCHOR;if(be>=LUNAR_ANCHOR_BE){for(let y=LUNAR_ANCHOR_BE;y<be;y++)d=add(d,lunarYearLen(y));}else{for(let y=be;y<LUNAR_ANCHOR_BE;y++)d=add(d,-lunarYearLen(y));}return d;}
function buddhistDays(year){const be=year+543,cs=be-1181,m=athikamat(cs),w=athikawan(cs),s=lunarStart(be);
  return{makha:add(s,m?102:73),visakha:add(s,m?191:161),asalha:add(s,(m?250:220)+(w?1:0))};}
const holCache={};
function officialHolidays(year){
  if(holCache[year])return holCache[year];
  const b=buddhistDays(year),p=n=>String(n).padStart(2,'0'),f=(m,d)=>`${year}-${p(m)}-${p(d)}`;
  const list=[[f(1,1),'วันขึ้นปีใหม่'],[b.makha,'วันมาฆบูชา'],[f(4,13),'วันสงกรานต์'],[f(4,14),'วันสงกรานต์'],[f(4,15),'วันสงกรานต์'],[f(5,1),'วันแรงงานแห่งชาติ'],
    [b.visakha,'วันวิสาขบูชา'],[f(6,3),'วันเฉลิมฯ พระราชินี'],[f(7,28),'วันเฉลิมฯ พระเจ้าอยู่หัว'],[b.asalha,'วันอาสาฬหบูชา'],[f(8,12),'วันแม่แห่งชาติ'],
    [f(10,13),'วันนวมินทรมหาราช'],[f(12,5),'วันพ่อแห่งชาติ'],[f(12,31),'วันสิ้นปี']];
  const extra=(state.company.extraHolidays||[]).filter(x=>Y(x.date)===year).map(x=>[x.date,x.name]);
  const removed=new Set(state.company.removedHolidays||[]);
  const res=[...list,...extra].filter(x=>!removed.has(x[0])).sort((a,b)=>a[0]<b[0]?-1:1);
  holCache[year]=res;return res;
}
function holidayMap(year){const m=new Map();officialHolidays(year).forEach(([d,n])=>m.set(d,m.has(d)?m.get(d)+' · '+n:n));return m;}
function officialName(s){return holidayMap(Y(s)).get(s)||null;}
// substitute day for a weekend-off rule: next day that is not weekend/holiday
function nextFree(s,weekendDays){let d=add(s,1);while(weekendDays.includes(dow(d))||officialName(d))d=add(d,1);return d;}
const subCache={};
function substitutes(kind,year){ // returns Map date->name for dn / om
  const k=kind+year;if(subCache[k])return subCache[k];const m=new Map();
  officialHolidays(year).forEach(([d,n])=>{const w=dow(d);
    if(kind==='dn'&&w===0)m.set(nextFree(d,[0]),'ชดเชย'+n);
    if(kind==='om'&&(w===0||w===6))m.set(nextFree(d,[0,6]),'ชดเชย'+n);});
  subCache[k]=m;return m;
}
function clearHolCache(){for(const k in holCache)delete holCache[k];for(const k in subCache)delete subCache[k];for(const k in compCache)delete compCache[k];}

function deriveAfter(cur,prev){

const compCache={};
function rotComps(gid,year){ // auto compensation for 4-off-2: holiday on OFF → first work day after the OFF block (unless a HOL already exists in that block)
  const k=gid+year;if(compCache[k])return compCache[k];const m=new Map();
  officialHolidays(year).forEach(([h,n])=>{
    if(parseCode(rawCode(gid,h)).kind!=='off')return;
    let d=h;let guard=0;while(parseCode(rawCode(gid,d)).kind==='off'&&guard++<10)d=add(d,1);
    // d = first non-off day; scan this work block for existing HOL
    let e=d,has=false,first=null;guard=0;
    while(guard++<10){const p=parseCode(rawCode(gid,e));if(p.kind==='hol'){has=true;break;}if(p.kind==='off')break;if(p.kind==='work'&&!p.ot&&!first&&!officialName(e)&&!m.has(e))first=e;e=add(e,1);}

    for(let b=add(h,-3);b<h;b=add(b,1))if(parseCode(rawCode(gid,b)).kind==='hol')has=true;
    if(!has&&first&&!isFixed(gid,first))m.set(first,'ชดเชย'+n);

}

const DT=/^(\d{4}-\d\d-\d\d)\s+(\d\d:\d\d)$/;
function parseSwipe(text){
  let tk=[];
  if(/<table/i.test(text)){const doc=new DOMParser().parseFromString(text,'text/html');doc.querySelectorAll('tr').forEach(tr=>tr.querySelectorAll('td,th').forEach(td=>tk.push(td.textContent.replace(/\s+/g,' ').trim())));}
  else text.split(/\r?\n/).forEach(l=>l.split('\t').forEach(t=>tk.push(t.replace(/\s+/g,' ').trim())));
  tk=tk.filter(Boolean);let profile=null;const rows=[];
  for(let i=0;i<tk.length;i++){const t=tk[i];
    if(!profile){const m=t.match(/^(\d{5,7})\s+([A-Z][A-Z .'-]+?)(?:\s*\(([A-Z0-9]+)\))?$/);if(m){profile={en:m[1],name:m[2].trim(),level:m[3]||''};const lv=tk[i+1];if(!profile.level&&lv&&/^[A-Z]{1,3}\d$/.test(lv))profile.level=lv;}}
    let date=null,j=i;const m=t.match(/^(Sun|Mon|Tue|Wed|Thu|Fri|Sat)\s+(\d{4}-\d\d-\d\d)$/);
    if(m){date=m[2];j=i+1;}else if(/^(Sun|Mon|Tue|Wed|Thu|Fri|Sat)$/.test(t)&&/^\d{4}-\d\d-\d\d$/.test(tk[i+1]||'')){date=tk[i+1];j=i+2;}
    if(!date)continue;let shift='',tin='',tout='',nums=[],k=j;
    for(;k<tk.length&&k<j+12;k++){const u=tk[k];
      if(k>j&&/^(Sun|Mon|Tue|Wed|Thu|Fri|Sat)(\s+\d{4}-\d\d-\d\d)?$/.test(u))break;if(k>j&&/^\d{5,7}\s+[A-Z]/.test(u))break;
      if(!shift&&/^[A-Z]{1,2}$/.test(u)){shift=u;continue;}
      if(DT.test(u)){if(!tin)tin=u;else if(!tout)tout=u;continue;}
      if(/^\d+\.\d+$/.test(u)&&tin)nums.push(parseFloat(u));if(nums.length>=2)break;}
    if(nums.length>=2){rows.push({date,shift:shift||'D',in:tin,out:tout,reg:nums[0],ot:nums[1]});i=k;}
  }
  return{profile,rows};
}

const CODE_NAME={AL:'ลาพักร้อน AL',SL:'ลาป่วย SL',CL:'ลากิจ CL',UL:'ลาไม่รับค่าจ้าง UL',ABS:'ขาดงาน',SWAP:'สลับกะ',ALH:'ลาชั่วโมง AL',OLH:'ลาชั่วโมงอื่น',LATE:'มาสาย',IGN:'ไม่นับ'};

function base(r,src){ // everything except tax

function taxProjection(ytd,r,salaryMonthly,fundHalf){ // ytd incl this round

function taxFor(r,src){ // walk from snapshot to r

  let ytd,start;

  else if(snap&&snap.key&&roundFor(snap.key).taxYear<r.taxYear||(!snap&&false)){ytd={income:0,tax:0,fund:0,sso:0};start=firstRoundOfYear(r.taxYear);}
  else if(snap&&snap.key===r.key)return{known:false,reason:'รอบนี้คือสลิปที่ใช้เป็นยอดสะสม ดูภาษีจากสลิปจริง'};

function dayDetail(gid,d){

  let ev='';

/* ================= account gate: splash, lock, onboarding ================= */
const SWATCH=['#F2553A','#14275C','#2F9A5F','#C47F0A','#8F80E8','#E0569B'];
let unlocked=false,hiddenAt=0;
async function hashPin(pin){const s='rootang:'+pin;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))|0;return 'f'+(h>>>0).toString(16);}}
function gate(html){const g=$('#gate');g.className='overlay '+(html.cls||'');g.innerHTML=html.body;g.hidden=false;document.body.style.overflow='hidden';return g;}
function closeGate(){const g=$('#gate');g.hidden=true;g.innerHTML='';document.body.style.overflow='';}
function maskName(){const ac=state.account||{};const n=(ac.nick||'').trim();return n.length<=2?n:n[0]+'•'.repeat(Math.min(6,n.length-2))+n[n.length-1];}
function pinPad({title,sub,head,len=6,onDone,link}){
  let v='';const g=gate({cls:'lock',body:`${head||''}<h2>${esc(title)}</h2>${sub?`<div class="who" style="margin:-10px 0 4px">${esc(sub)}</div>`:''}<div class="pdots" id="pd">${'<i></i>'.repeat(len)}</div><div class="msg" id="pmsg"></div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(k=>`<button data-k="${k}">${k}</button>`).join('')}<button class="ghost" aria-hidden="true" tabindex="-1"></button><button data-k="0">0</button><button class="ghost" data-k="del" aria-label="ลบ"><svg class="i" viewBox="0 0 24 24" style="width:30px;height:30px"><path d="M21 6H9l-6 6 6 6h12z"/><path d="m12 9 6 6M18 9l-6 6"/></svg></button></div>
    ${link?`<button class="link" id="plink">${esc(link.text)}</button>`:''}`});
  const draw=()=>g.querySelectorAll('#pd i').forEach((d,i)=>d.classList.toggle('on',i<v.length));
  const fail=m=>{const pd=g.querySelector('#pd');pd.classList.remove('err');void pd.offsetWidth;pd.classList.add('err');g.querySelector('#pmsg').textContent=m;v='';draw();};
  const press=k=>{if(k==='del')v=v.slice(0,-1);else if(v.length<len)v+=k;draw();if(v.length===len){const p=v;setTimeout(()=>onDone(p,fail),120);}};
  g.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));
  g.onkeydown=e=>{if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('del');};g.tabIndex=-1;g.focus();
  if(link)g.querySelector('#plink').onclick=link.fn;
}
function lockHead(){return `<div style="display:flex;justify-content:center;margin-top:4vh">${avatarHTML()}</div><div class="who">คุณ ${esc(maskName())}${state.profile&&state.profile.en?'':''} · ${esc(G(state.me.group).label)}</div>`;}

  unlocked=false;
  pinPad({title:'กรุณาใส่รหัส PIN',head:lockHead(),onDone:async(p,fail)=>{if(await hashPin(p)===state.account.pinHash){unlocked=true;closeGate();render();}else fail('รหัส PIN ไม่ถูกต้อง');},
    link:{text:'ลืมรหัส PIN?',fn:forgotPin}});
}
function forgotPin(){
  gate({cls:'lock',body:`<h2>ลืมรหัส PIN</h2><p style="max-width:320px;text-align:center;opacity:.8;line-height:1.6">ข้อมูลเก็บอยู่ในมือถือเครื่องนี้เท่านั้น ไม่มีใครรีเซ็ตรหัสให้ได้<br>ทางเดียวคือ <b>ล้างข้อมูลแล้วตั้งบัญชีใหม่</b><br>ถ้าเคยสำรองข้อมูลไว้ กู้คืนได้ในหน้าบัญชีหลังตั้งใหม่</p>
    <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;margin-top:20px"><button class="btnbig" id="fp-wipe" style="background:#F2553A">ล้างข้อมูลและตั้งบัญชีใหม่</button><button class="btnbig sec2" id="fp-back">กลับไปใส่รหัส</button></div>`});
  $('#fp-back').onclick=showLock;$('#fp-wipe').onclick=()=>{state=fresh(false);save();onboarding(1);};

let ob={};

  if(step===4){pinSetup(()=>{state.account={...state.account,setup:true};save();unlocked=true;closeGate();state.ui.tab='home';render();toast('ตั้งบัญชีเรียบร้อย ยินดีต้อนรับ');},()=>onboarding(3),'ตั้งรหัส PIN 6 หลัก','ใช้ทุกครั้งที่เปิดแอป');return;}
  let body='';
  if(step===1)body=`<h2>ยินดีต้อนรับสู่<br>รู้ตังค์</h2><p>ตั้งบัญชีของคุณ ข้อมูลทั้งหมดเก็บในมือถือเครื่องนี้เท่านั้น</p>
    <div style="display:flex;justify-content:center;padding:6px 0"><span id="ob-av"></span></div>
    <div class="fld"><label for="ob-nick">ชื่อเล่น (ใช้ทักทาย)</label><input class="input" id="ob-nick" value="${esc(ob.nick)}" placeholder="เช่น แฟรงค์" maxlength="20"></div>
    <div class="fld"><label for="ob-en">EN รหัสพนักงาน (ไม่บังคับ)</label><input class="input num" id="ob-en" value="${esc(ob.en)}" inputmode="numeric" maxlength="8"></div>
    <div class="fld"><label>สีโปรไฟล์ หรือรูป</label><div class="swatches">${SWATCH.map(c=>`<button data-c="${c}" style="background:${c}" aria-pressed="${ob.color===c&&!ob.photo}" aria-label="สี"></button>`).join('')}<label class="btn sm" for="ob-photo" style="cursor:pointer">เลือกรูป</label><input type="file" id="ob-photo" accept="image/*" hidden>${ob.photo?'<button class="btn sm" id="ob-nophoto">ไม่ใช้รูป</button>':''}</div></div>`;
  if(step===2)body=`<h2>ทีมของคุณ</h2><p>ใช้แสดงตารางกะและคำนวณ OT · เปลี่ยนทีหลังได้</p><div class="teamgrid">${GROUPS.map(g=>`<button data-g="${g.id}" aria-pressed="${ob.group===g.id}">${esc(g.label)}</button>`).join('')}</div>`;
  if(step===3)body=`<h2>ข้อมูลเงินเดือน</h2><p>ใช้คำนวณสลิป · ข้ามไปก่อนได้ ใส่ทีหลังในหน้าบัญชี</p>
    <div class="seg"><button data-pt="monthly" aria-pressed="${ob.payType==='monthly'}">รายเดือน</button><button data-pt="daily" aria-pressed="${ob.payType==='daily'}">รายวัน</button></div>
    ${ob.payType==='monthly'?`<div class="fld"><label for="ob-sal">เงินเดือน (บาท)</label><input class="input num" id="ob-sal" inputmode="decimal" value="${esc(ob.salary)}"></div>`:`<div class="fld"><label for="ob-wage">ค่าแรงต่อวัน (บาท)</label><input class="input num" id="ob-wage" inputmode="decimal" value="${esc(ob.dayWage)}"></div>`}
    <div class="fld"><label for="ob-fund">กองทุนสะสม (% ต่อเดือน)</label><input class="input num" id="ob-fund" inputmode="decimal" value="${esc(ob.fundPct)}" placeholder="เช่น 15"></div>
    <div class="fld"><label for="ob-kys">กยศ. (บาทต่อเดือน)</label><input class="input num" id="ob-kys" inputmode="decimal" value="${esc(ob.kys)}" placeholder="ไม่มีเว้นว่าง"></div>`;
  const g=gate({cls:'onb',body:`<div class="onb-in">${steps}${back}${body}<div class="grow"></div>${step===3?'<button class="btnbig sec2" id="ob-skip">ข้ามไปก่อน</button>':''}<button class="btnbig" id="ob-next">ถัดไป</button></div>`});
  const sync=()=>{const n=g.querySelector('#ob-nick');if(n)ob.nick=n.value;const e=g.querySelector('#ob-en');if(e)ob.en=e.value;
    [['#ob-sal','salary'],['#ob-wage','dayWage'],['#ob-fund','fundPct'],['#ob-kys','kys']].forEach(([s,k])=>{const x=g.querySelector(s);if(x)ob[k]=x.value;});};
  const drawAv=()=>{const a=g.querySelector('#ob-av');if(a)a.innerHTML=`<span class="av" style="width:88px;height:88px;font-size:34px;border:none;${ob.photo?`background-image:url(${ob.photo})`:`background:${ob.color}`}">${ob.photo?'':esc((ob.nick||'?').trim().charAt(0).toUpperCase())}</span>`;};

  const ph=g.querySelector('#ob-photo');if(ph)ph.onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');cv.width=cv.height=160;const s=Math.min(img.width,img.height);cv.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,160,160);sync();ob.photo=cv.toDataURL('image/jpeg',.82);onboarding(1);};img.src=URL.createObjectURL(f);};
  const np=g.querySelector('#ob-nophoto');if(np)np.onclick=()=>{sync();ob.photo=null;onboarding(1);};
  const nk=g.querySelector('#ob-nick');if(nk)nk.oninput=()=>{ob.nick=nk.value;drawAv();};
  g.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ob.group=b.dataset.g;g.querySelectorAll('[data-g]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  g.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{sync();ob.payType=b.dataset.pt;onboarding(3);});
  const bk=g.querySelector('#ob-back');if(bk)bk.onclick=()=>{sync();onboarding(step-1);};
  const commit=()=>{const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:0;};
    state.account={...(state.account||{}),nick:ob.nick.trim(),en:ob.en.trim(),color:ob.color,photo:ob.photo};
    state.me={...state.me,group:ob.group,payType:ob.payType,salary:num(ob.salary),dayWage:num(ob.dayWage),fundPct:num(ob.fundPct),kys:num(ob.kys)};save();};
  g.querySelector('#ob-next').onclick=()=>{sync();if(step===1&&!ob.nick.trim()){toast('ใส่ชื่อเล่นก่อนนะ');return;}commit();onboarding(step+1);};
  const sk=g.querySelector('#ob-skip');if(sk)sk.onclick=()=>{sync();ob.salary=ob.salary||'';commit();onboarding(4);};
}

    state.account={...(state.account||{}),pinHash:await hashPin(p1)};save();done();},link:{text:'เริ่มใหม่',fn:()=>pinSetup(done,cancel,title,sub)}});},link:cancel?{text:'ย้อนกลับ',fn:cancel}:null});

function questionSheet(onlyDate){

  if(!list.length){toast(Object.keys(state.swipe).length?'ไม่มีวันที่ต้องยืนยันแล้ว 🎉':'นำเข้า swipe ก่อน แอปจะเทียบกับแผนกะให้');return;}
  let i=0;
  const draw=()=>{const it=list[i];let pick=state.answers[it.date]||null;const opts=it.type==='miss'?MISS_OPTS:SHORT_OPTS;
    let title,sub,fact;
    if(it.type==='miss'){const c=it.shift;title=`${fd(it.date)} ไม่มีเวลาสแกน`;sub='ตามแผนวันนี้คุณมีกะ วันนี้คือ…';
      fact=`<div class="ev"><span class="sw" style="background:${c.p.night?'var(--n)':'var(--d)'}"></span><div class="t"><b>${esc(shiftName(c))}</b><span>${c.p.time.replace('-',' – ')} · ${esc(G(state.me.group).label)}</span></div></div>`;}
    else{const r=it.row,l=lateOf(r);title=`${fd(it.date)} มาไม่ครบ 7 ชม.`;sub=`ทำงาน ${hrs(r.reg)} ชม. ขาดไป ${hrs(7-r.reg)} ชม. คือ…`;
      fact=`<div class="ev"><span class="sw" style="background:${r.shift==='N'?'var(--n)':'var(--d)'}"></span><div class="t"><b>${r.shift==='N'?'กะดึก N':'กะเช้า D'}</b><span>เข้า <span class="num">${esc((r.in||'').slice(11))}</span>${l?` <span class="redb">สาย ${l.mins} นาที</span>`:''} · ออก <span class="num">${esc((r.out||'').slice(11))}</span></span></div></div>`;}
    const sal=state.me.payType==='monthly'?state.me.salary/30:state.me.dayWage;
    openSheet(`<div class="hd"><button class="x" id="q-skip">${onlyDate?'ปิด':'ข้าม'}</button><span class="qstep">${i+1} จาก ${list.length}</span><button class="ok" id="q-next">${i===list.length-1?'เสร็จ':'ถัดไป'}</button></div>
      <div><b style="font-size:20px">${title}</b><div class="lbl2" style="margin-top:2px">${sub}</div></div>${fact}
      <div class="opts">${opts.map(([k,t,s])=>`<button class="opt" data-k="${k}" aria-pressed="${pick===k}"><i></i><span>${t}<small>${(k==='UL'||k==='ABS')&&sal?esc(s.replace('เงินเดือน ÷ 30',money(sal))):esc(s)}</small></span></button>`).join('')}</div>
      ${state.answers[it.date]?'<button class="btn danger" id="q-clear">ล้างคำตอบวันนี้</button>':''}`,m=>{
      m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{pick=b.dataset.k;m.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b));});
      m.querySelector('#q-skip').onclick=()=>{if(onlyDate||i>=list.length-1){closeSheet();render();}else{i++;draw();}};
      m.querySelector('#q-next').onclick=()=>{if(!pick){toast('เลือกคำตอบก่อน หรือกดข้าม');return;}state.answers[it.date]=pick;save();if(i>=list.length-1){closeSheet();render();toast('บันทึกแล้ว');}else{i++;draw();}};
      const cl=m.querySelector('#q-clear');if(cl)cl.onclick=()=>{delete state.answers[it.date];save();closeSheet();render();};

function inputSheet(title,hint,accept,onText){
  openSheet(`${hd(title,'นำเข้า')}<p class="lbl2" style="margin:0">${hint}</p><label class="lbl2" for="i-file">เลือกไฟล์</label><input type="file" id="i-file" accept="${accept}" class="input"><label class="lbl2" for="i-paste">หรือวางข้อความ</label><textarea class="input mono" id="i-paste" placeholder="วางที่นี่"></textarea>`,m=>{
    const go=t=>{if(onText(t)!==false)closeSheet();};
    m.querySelector('#i-file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>go(String(rd.result));rd.readAsText(f);};
    m.querySelector('#sh-ok').onclick=()=>{const t=m.querySelector('#i-paste').value;if(!t.trim()){toast('ยังไม่ได้วางข้อความ');return;}go(t);};});
}
function enOf(){return (state.account&&state.account.en)||(state.profile&&state.profile.en)||'';}
function swipeHint(){const en=enOf();
  return `<span style="display:flex;flex-direction:column;gap:10px;color:var(--ink2)">
  <a class="btnbig" href="${SWIPE_URL}" target="_blank" rel="noopener" style="text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px">เปิดเว็บ Swipe IN/OUT ↗</a>
  ${en?`<span class="row" style="justify-content:center">EN ของคุณ <b class="num">${esc(en)}</b><button class="btn sm" data-copy="${esc(en)}">คัดลอก EN</button></span>`:''}
  <span style="font-size:13px">1. ใส่ EN และช่วงวันที่ → <b>GO</b><br>2. กด <b>Export to excel</b> บันทึกไฟล์<br>3. กลับมาที่แอป แล้วเลือกไฟล์ด้านล่าง (หรือคัดลอกตารางมาวาง)</span></span>`;}
function importSwipe(){
  inputSheet('นำเข้า swipe',swipeHint(),'.xls,.html,.htm,.txt,text/html,text/plain',t=>{
    const res=parseSwipe(t);if(!res.rows.length){toast('ไม่พบข้อมูล swipe ในไฟล์นี้');return false;}
    if(state.sample){state.swipe={};state.sample=false;}
    res.rows.forEach(r=>state.swipe[r.date]=r);if(res.profile)state.profile=res.profile;
    const ds=res.rows.map(r=>r.date).sort();state.ui.round=roundFor(ds[ds.length-1]).key;state.ui.src='swipe';state.ui.tab='pay';
    save();render();setTimeout(()=>{if(unanswered().length)toast(`นำเข้าแล้ว · มี ${unanswered().length} วันที่ต้องยืนยัน`);},2500);toast(`นำเข้า ${res.rows.length} วัน (${fd(ds[0],{dow:false})} – ${fd(ds[ds.length-1],{dow:false})})`);});
}
function leaveSheet(){
  const t=todayStr();
  openSheet(`${hd('เพิ่มวันลา','บันทึก')}
    <label class="lbl2" for="l-date">วันที่</label><input class="input" type="date" id="l-date" value="${t}">
    <label class="lbl2" for="l-type">ประเภท</label><select class="input" id="l-type">${Object.entries(LEAVES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
    <div class="row"><input class="input" id="l-amt" inputmode="decimal" value="1" style="flex:1" aria-label="จำนวน"><select class="input" id="l-unit" style="flex:1" aria-label="หน่วย"><option value="day">วัน</option><option value="hour">ชั่วโมง</option></select></div>
    <p class="lbl2" style="margin:0">AL ไม่มีผลกับเบี้ยขยัน · ลาอื่นแม้ 1 ชม. ลดเหลือ ${state.company.bonusPart}% · เกิน 1 วันไม่ได้ · UL/ขาดงานหักเงินวันละ เงินเดือน ÷ 30</p>`,m=>{
      m.querySelector('#sh-ok').onclick=()=>{const date=m.querySelector('#l-date').value,amt=parseFloat(m.querySelector('#l-amt').value);if(!date||!(amt>0)){toast('ใส่วันที่และจำนวนให้ครบ');return;}
        state.leaves.push({id:Date.now().toString(36),date,type:m.querySelector('#l-type').value,amount:amt,unit:m.querySelector('#l-unit').value});save();closeSheet();render();toast('บันทึกวันลาแล้ว');};});
}
function groupSheet(){
  const cur=state.ui.group||state.me.group;
  openSheet(`${hd('ดูแผนของทีม')}<div class="group">${GROUPS.map(g=>`<button class="li" data-g="${g.id}"><span class="k" style="${g.id===cur?'font-weight:700':''}">${esc(g.label)}${g.id===state.me.group?'<small>ทีมของฉัน</small>':''}</span>${g.id===cur?'<span class="v">✓</span>':''}</button>`).join('')}</div>`,m=>{
    m.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{state.ui.group=b.dataset.g;save();closeSheet();render();});});
}
function pinSheet(){
  const setting=!state.owner.pin;
  openSheet(`${hd(setting?'ตั้งรหัสผู้ออกแบบ':'ใส่รหัสผู้ออกแบบ','ยืนยัน')}<p class="lbl2" style="margin:0">${setting?'ตั้งรหัส 4 หลัก ใช้ทุกครั้งที่เปิดโหมดแก้แผน กันการแก้ตัวเลขโดยไม่ตั้งใจ':'โหมดนี้แก้แผนกะและเงื่อนไขบริษัทได้'}</p><input class="input num" id="pin" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="รหัส">`,m=>{
    m.querySelector('#sh-ok').onclick=()=>{const v=m.querySelector('#pin').value.trim();if(!/^\d{4,6}$/.test(v)){toast('รหัส 4–6 หลัก');return;}
      if(setting)state.owner.pin=v;else if(v!==state.owner.pin){toast('รหัสไม่ถูกต้อง');return;}
      state.owner.on=true;save();closeSheet();render();toast('เปิดโหมดผู้ออกแบบแล้ว');};setTimeout(()=>m.querySelector('#pin').focus(),50);});
}
function customCode(){
  openSheet(`${hd('เวลาอื่น','ใช้')}<div class="row"><label class="lbl2" style="flex:1">เข้า<input class="input" type="time" id="c-a" value="07:00"></label><label class="lbl2" style="flex:1">ออก<input class="input" type="time" id="c-b" value="19:30"></label></div>
    <label class="switch row lbl2"><input type="checkbox" id="c-ot"> มาทำ OT ในวันหยุด (OT D / OT N)</label>`,m=>{
    m.querySelector('#sh-ok').onclick=()=>{const a=m.querySelector('#c-a').value,b=m.querySelector('#c-b').value;if(!a||!b)return;setCode((m.querySelector('#c-ot').checked?'OT|':'')+`${a}-${b}`);closeSheet();};});
}
function holAddSheet(){
  openSheet(`${hd('เพิ่มวันหยุดพิเศษ','เพิ่ม')}<input class="input" type="date" id="h-d" aria-label="วันที่"><input class="input" id="h-n" placeholder="ชื่อวันหยุด เช่น วันหยุดพิเศษตามประกาศ">`,m=>{
    m.querySelector('#sh-ok').onclick=()=>{const d=m.querySelector('#h-d').value,n=m.querySelector('#h-n').value.trim()||'วันหยุดพิเศษ';if(!d)return;state.company.extraHolidays=[...(state.company.extraHolidays||[]),{date:d,name:n}];save();closeSheet();render();};});
}
function confirmSheet(title,msg,ok,fn){openSheet(`${hd(title)}<p style="margin:0">${msg}</p><button class="btn danger" id="cf">${esc(ok)}</button>`,m=>{m.querySelector('#cf').onclick=()=>{fn();closeSheet();};});}
function setCode(c){const gid=state.ui.group||state.me.group;const d=state.ui.sel||todayStr();state.planEdits[gid]=state.planEdits[gid]||{};
  if(c==='__reset')delete state.planEdits[gid][d];else state.planEdits[gid][d]=c;
  if(state.ui.advance&&c!=='__reset'){state.ui.sel=add(d,1);if(state.ui.sel.slice(0,7)!==(state.ui.month||'').slice(0,7))state.ui.month=state.ui.sel.slice(0,8)+'01';}
  save();render();}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const tb=e.target.closest('#tabs button');if(tb){if(tb.dataset.tab==='import'){importSwipe();return;}state.ui.tab=tb.dataset.tab;save();render();scrollTo(0,0);return;}
  const el=e.target.closest('[data-act]');if(!el||el.closest('#modal')||el.closest('#gate'))return;const a=el.dataset.act;
  switch(a){
    case 'go-today':{const t=todayStr();state.ui.sel=t;state.ui.month=t.slice(0,8)+'01';state.ui.round=null;break;}
    case 'tab':state.ui.tab=el.dataset.t;scrollTo(0,0);break;
    case 'cal-day':state.ui.tab='cal';state.ui.sel=el.dataset.d;state.ui.month=el.dataset.d.slice(0,8)+'01';scrollTo(0,0);break;
    case 'questions':questionSheet();return;
    case 'page':state.ui.prev=state.ui.tab;state.ui.tab=el.dataset.p;if(el.dataset.p==='hol')state.ui.holYear=null;scrollTo(0,0);break;
    case 'back':state.ui.tab=state.ui.prev&&!['hol','help'].includes(state.ui.prev)?state.ui.prev:'home';scrollTo(0,0);break;
    case 'hol-year':state.ui.holYear=(state.ui.holYear||Y(todayStr()))+ +el.dataset.dir;break;
    case 'ans-del':questionSheet(el.dataset.d);return;
    case 'bonus-pick':{const r=state.ui.round?roundFor(state.ui.round):upcoming();const ex=state.extras[r.key]=state.extras[r.key]||{};ex.bonusPct=+el.dataset.p;break;}
    case 'pin-change':changePin();return;
    case 'lock-now':showLock();return;
    case 'profile-edit':onboarding(1);return;
    case 'photo-del':state.account.photo=null;toast('ลบรูปแล้ว');break;
    case 'goto-pay':state.ui.tab='pay';state.ui.round=el.dataset.round;state.ui.src=el.dataset.src;break;
    case 'team':state.ui.group=el.dataset.g;state.ui.tab='cal';break;
    case 'clear-sample':{const keep={me:{...state.me,salary:0,fundPct:0,kys:0},ui:state.ui};state=fresh(false);state.ui=keep.ui;state.me.group=keep.me.group;state.ui.tab='set';toast('ล้างตัวอย่างแล้ว ใส่ข้อมูลของคุณได้เลย');break;}
    case 'group-pick':groupSheet();return;
    case 'month':{const cur=state.ui.month||todayStr().slice(0,8)+'01';state.ui.month=ymd(Y(cur),M(cur)+ +el.dataset.dir,1);break;}
    case 'sel':{state.ui.sel=el.dataset.d;const h=holidayFor(state.ui.group||state.me.group,el.dataset.d);if(h)toast(`${fd(el.dataset.d)} · ${h.name}`);break;}
    case 'note-new':noteSheet(el.dataset.d||state.ui.sel||todayStr());return;
    case 'note-edit':noteSheet(el.dataset.d,el.dataset.id);return;
    case 'set-code':setCode(el.dataset.c);return;
    case 'custom-code':customCode();return;
    case 'adv':state.ui.advance=!state.ui.advance;break;
    case 'round':{const r=state.ui.round?roundFor(state.ui.round):upcoming();state.ui.round=nextRound(r,+el.dataset.dir).key;break;}
    case 'src':state.ui.src=el.dataset.s;break;
    case 'import':importSwipe();return;
    case 'mark':state.marks[el.dataset.d]=el.dataset.m;break;
    case 'leave-add':leaveSheet();return;
    case 'leave-del':state.leaves=state.leaves.filter(l=>l.id!==el.dataset.id);break;
    case 'ex-toggle':{const r=state.ui.round?roundFor(state.ui.round):upcoming();const ex=state.extras[r.key]=state.extras[r.key]||{};const k=el.dataset.k;ex[k]=k==='bonus'?ex.bonus===false:!ex[k];break;}
    case 'paytype':state.me.payType=el.dataset.v;break;
    case 'owner':if(state.owner.on){state.owner.on=false;toast('ปิดโหมดผู้ออกแบบแล้ว');break;}pinSheet();return;
    case 'hol-del':state.company.removedHolidays=[...(state.company.removedHolidays||[]),el.dataset.d];state.company.extraHolidays=(state.company.extraHolidays||[]).filter(x=>x.date!==el.dataset.d);break;
    case 'hol-add':holAddSheet();return;
    case 'plan-export':{const out={app:'payot-plan',version:APP_VERSION,exported:new Date().toISOString(),start:PLAN_SEED.start,company:state.company,
        groups:GROUPS.map(g=>({id:g.id,label:g.label,type:g.type,days:g.days.map((_,i)=>rawCode(g.id,add(PLAN_SEED.start,i)))})),edits:state.planEdits};textSheet('ส่งออกแผน',JSON.stringify(out));return;}
    case 'plan-import':inputSheet('นำเข้าแผน','ไฟล์หรือข้อความที่ส่งออกจากแอปนี้','.json,application/json,text/plain',t=>{
        try{const p=JSON.parse(t);if(p.app!=='payot-plan')throw 0;state.planEdits=p.edits||{};if(p.company)state.company={...COMPANY_DEFAULT,...p.company};save();render();toast('นำเข้าแผนแล้ว');}catch(err){toast('ข้อมูลนี้ไม่ใช่แผนจากแอปนี้');return false;}});return;
    case 'plan-reset':confirmSheet('ล้างการแก้ไขแผน','กะที่แก้ทั้งหมดจะกลับเป็นแผนจาก Excel','ล้างการแก้ไข',()=>{state.planEdits={};save();render();});return;
    case 'backup':textSheet('สำรองข้อมูล',JSON.stringify({...state,ui:undefined,app:'payot-backup'}));return;
    case 'restore':inputSheet('กู้คืนข้อมูล','ข้อมูลในเครื่องนี้จะถูกแทนที่','.json,text/plain',t=>{try{const b=JSON.parse(t);if(b.app!=='payot-backup')throw 0;delete b.app;const f=fresh(false);state={...f,...b,ui:f.ui};state.answers=b.answers||{};state.me={...ME_DEFAULT,...b.me};state.company={...COMPANY_DEFAULT,...b.company};save();render();toast('กู้คืนแล้ว');}catch(err){toast('ข้อมูลสำรองไม่ถูกต้อง');return false;}});return;
    case 'wipe':confirmSheet('ออกจากระบบและล้างข้อมูล','บัญชี เงินเดือน swipe วันลา โน้ต และการแก้แผนในเครื่องนี้จะถูกลบ ควรสำรองข้อมูลไว้ก่อน','ล้างและออกจากระบบ',()=>{state=fresh(false);save();render();onboarding(1);});return;
    default:return;
  }
  save();render();
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;const v=b.dataset.copy;
  (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('คัดลอก '+v+' แล้ว')).catch(()=>toast('EN: '+v));});
document.addEventListener('change',e=>{
  const el=e.target;const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:0;};
  if(el.id==='acct-photo'){const f=el.files[0];if(!f)return;const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');cv.width=cv.height=200;const s=Math.min(img.width,img.height);
    cv.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,200,200);state.account.photo=cv.toDataURL('image/jpeg',.82);save();render();toast('เปลี่ยนรูปโปรไฟล์แล้ว');};img.onerror=()=>toast('เปิดรูปนี้ไม่ได้ ลองรูปอื่น');img.src=URL.createObjectURL(f);return;}
  if(el.dataset.me){const k=el.dataset.me;state.me[k]=k==='group'?el.value:num(el.value);if(state.sample&&k==='salary')state.sample=false;}
  else if(el.dataset.company){if(!state.owner.on)return;const k=el.dataset.company;state.company[k]=num(el.value);}
  else if(el.dataset.ytd){const k=el.dataset.ytd;state.me.ytd=state.me.ytd||{};state.me.ytd[k]=k==='key'?el.value:num(el.value);}
  else if(el.dataset.ex){const r=state.ui.round?roundFor(state.ui.round):upcoming();const ex=state.extras[r.key]=state.extras[r.key]||{};ex[el.dataset.ex]=num(el.value);}
  else return;
  save();render();toast('บันทึกแล้ว');
});
boot();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>{
  r.addEventListener('updatefound',()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){try{toast('มีเวอร์ชันใหม่ ปิดแล้วเปิดแอปอีกครั้งเพื่ออัปเดต');}catch(e){}}});});
}).catch(()=>{});});}
</script>
</body>
